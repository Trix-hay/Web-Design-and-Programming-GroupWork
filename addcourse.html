<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Add Course" content="Allows users to add a course.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Add Course</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a> <!--provides access back to home page, probably want on all pages in some form-->
            <h2>Add Course</h2>
            <p>This page allows users to add a course to a semester.</p>
        </header>

        <form method="POST">

            <label for="Semester">Semester: </label>
            <select id="Semester">
                <option>Spring</option>
                <option>Summer</option>
                <option>Fall</option>
            </select><br>

            <label for="CoursePrefix">Course Prefix: </label>
            <input type="text" name ="CoursePrefix" id="CoursePrefix"><br>

            <label for="CourseNumber">Course Number: </label>
            <input type="text" name ="CourseNumber" id="CourseNumber"><br>

            <label for="CourseSection">Course Section: </label>
            <input type="text" name ="CourseSection" id="CourseSection"><br>
            
            <label for="CourseName">Course Name: </label>
            <input type="text" name="CourseName" id="CourseName"><br>

            <label for="Room">Room: </label>
            <input type="text" placeholder="Building & Room Number" name="Room" id="Room"><br>
            
            <label for="DaysOffered">Days Offered: </label>
            <select name="DaysOffered" id="DaysOffered"> <!-- do select tags need the name attribute?-->
                <option>Monday, Wednesday, Friday</option>
                <option>Monday, Wednesday</option>
                <option>Tuesday, Thursday</option>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
            </select><br>

            <label for="MWFTime">Time of course (MWF): </label>
            <select name="MWFTime" id="MWFTime">
                <option>8:00am to 8:50am</option>
                <option>9:00am to 9:50am</option>
                <option>10:00am to 10:50am</option>
                <option>11:00am to 11:50am</option>
                <option>12:00pm to 12:50pm</option>
                <option>1:00pm to 1:50pm</option>
                <option>2pm to 2:50pm</option>
                <option>3pm to 3:50pm</option>
            </select><br>

            <label for="MWTime">Time of course (MW): </label>
            <select name="MWTime" id="MWTime">
                <option>9:00am to 10:50am</option>
                <option>1:00pm to 2:15pm</option>
                <option>1:00pm to 2:50pm</option>
                <option>2:00pm to 3:15pm</option>
            </select><br>
            
            <label for="TThTime">Time of course (TTh): </label>
            <select name="TThTime" id="TThTime">
                <option>8:00am to 9:15am</option>
                <option>9:30am to 10:45am</option>
                <option>11:00am to 12:15pm</option>
                <option>1:00pm to 2:15pm</option>
                <option>2:30pm to 3:45pm</option>
            </select><br> 

            <label for="SingleDayTime">Time of course (single day): </label>
            <select name="SingleDayTime" id="SingleDayTime">
                <option>1:00pm to 4:00pm</option>
                <option>2:00pm to 5:00pm</option>
                <option>7:00pm to 9:30pm</option>
            </select><br>

            <label for="CreditHours">Credit Hours: </label>
            <input type="text" name="CreditHours" id="CreditHours"><br>

            <label for="InstructorFirstName">Instructor First Name: </label>
            <input type="text" name="InstructorFirstName" id="InstructorFirstName"><br>
            
            <label for="InstructorLastName">Instructor Last Name: </label>
            <input type="text" name="InstructorLastName" id="InstructorLastName"><br>

            <label for="EnrollmentCap">Enrollment Cap: </label>
            <input type="text" name="EnrollmentCap" id="EnrollmentCap"><br>

            <button type="submit">Submit</button>
            
        </form>

        <footer>

        </footer>
        
    </body>
</html>
