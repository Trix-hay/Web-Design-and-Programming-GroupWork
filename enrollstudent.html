<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Enroll Student" content="Allows the user to add a student to our Web application.">
        <title>Course Registration: Enroll Student</title>
    </head>

    <body>
        <main>
            <h1>Enroll Student</h1> 
            <form>
               <label for="StudentFirstName">StudentFirstName:</label>
               <input type="text" id="StudentFirstName"><br>

               <label for="StudentLastName">StudentLastName:</label>
               <input type="text" id="StudentLastName"><br>

               <label for="Year">Year:</label>
               <select id="Year">
                    <option>Freshman</option>
                     <option>Sophomore</option>
                     <option>Junior</option>
                    <option>Senior</option>
               </select><br>

               <label for="Major">Major:</label>
               <input type="text" id="Major"><br>

               <label for="EmailAddress">SchoolEmail:</label>
               <input type="text" id="EmailAddress"><br>

               <button type="submit">Submit</button>
            </form>     
        </main>
    </body> 
</html>
