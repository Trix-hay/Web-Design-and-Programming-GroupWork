<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Add Instructor" content="Allows users to add an instructor.">
        <title>Course Registration: Add Instructor</title>
    </head>

    <body>
        <main>
            <h1>Add Instructor</h1>
            <form>
                <label for="InstructorFirstName">Instructor's First Name:</label>
                <input type="text" id="InstructorFirstName"><br>

                <label for="InstructorLastName">Instructor's LastName:</label>
                <input type="text" id="InstructorLastName"><br>

                <label for="Department">Instructor's Department:</label>
                <input type="text" id="Department"><br>

                <label for="Rank">Rank:</label>
                <select id="Rank">
                    <option>Instructor</option>
                    <option>Assistant Professor</option>
                    <option>Associate Professor</option>
                    <option>Professor</option>
                </select><br>

                <label for="InstructorEmailAddress">Email:</label>
                <input type="text" id="InstructorEmailAddress"><br>

                <button type="submit">Submit</button>
            </form>
        </main>
        
    </body>
</html>
