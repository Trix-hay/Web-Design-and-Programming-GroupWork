<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Register Course" content="Allows users to register for a course.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Register Course</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a> 
            <h2>Register Course</h2>
            <p>This page allows users to register for a course.</p>
        </header>
        
        <form method="POST" enctype="multipart/form-data">
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstNameText">
            <br>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" id="lastNameText">
            <br>
            <label for="semester">Semester:</label>
            <input type="text" name="semester" id="semesterText">
            <br>
            <label for="courseprefix">Course Prefix:</label>
            <input type="text" name="courseprefix" id="coursePre">
            <br>
            <label for="coursenumber">Course Number:</label>
            <input type="text" name="coursenumber" id="courseNum">
            <br>
            <label for="coursesection">Course Section:</label>
            <input type="text" name="coursesection" id="courseSec">
            <br>
            <button type="submit">Submit</button> <!-- i am not sure if these need ID attributes, I just changed them to get the CSS to work. We can add the ID if needed-->
        </form>

        <footer>

        </footer>
    </body>
</html>
