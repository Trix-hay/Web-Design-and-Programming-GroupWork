<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Drop Course" content="Allows users to drop a course.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Drop Course</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a>
            <h2>Drop Course</h2>
            <p>This page allows users to drop a course.</p>
        </header>

        <form method="POST" enctype="multipart/form-data">
            <label for="firstname">First Name:</label>
            <input type="text" name="firstname" id="firstNameTextDrop"> <!-- id should match for in label field, per Google. all can be the same if that's easier, since we aren't using radio buttons or other input types that only allow one option to be chosen out of mutiple -->
            <br>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" id="lastNameTextDrop">
            <br>
            <label for="semester">Semester:</label>
            <input type="text" name="semester" id="semesterTextDrop">
            <br>
            <label for="courseprefix">Course Prefix:</label>
            <input type="text" name="courseprefix" id="coursePreDrop">
            <br>
            <label for="coursenumber">Course Number:</label>
            <input type="text" name="coursenumber" id="courseNumDrop">
            <br>
            <label for="coursesection">Course Section:</label>
            <input type="text" name="coursesection" id="courseSecDrop">
            <br>
            <input type="submit" name="submitbutton" id="submitButtonDrop">
        </form>

        <footer>

        </footer>
    </body>
</html>
