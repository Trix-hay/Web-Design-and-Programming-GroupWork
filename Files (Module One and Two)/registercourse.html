<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Register Course" content="Allows users to register for a course.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Register Course</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a> 
            <h2>Register Course</h2>
            <p>This page allows users to register for a course.</p>
        </header>
        
        <form method="POST" enctype="multipart/form-data">
            <label for="firstname">First Name:</label>
            <input type="text" 
                   name="firstname" 
                   required 
                   pattern="[A-Za-z '\-]+" id="firstname"
                   id="firstname"
                   oninvalid="this.setCustomValidity('Enter Data in this format: FirstName')"
                   oninput="this.setCustomValidity('')">
            <br>
            <label for="lastname">Last Name:</label>
            <input type="text" name="lastname" required pattern="[A-Za-z '\-]+" id="lastname">
            <br>
            <label for="semester">Semester:</label>
            <input type="text"
                   name="semester" 
                   required 
                   pattern="(Spring|Summer|Fall) [0-9]{4}" 
                   min="2026" 
                   step="1" 
                   id="semester"
                   oninvalid="this.setCustomValidity('Enter Data in this format: Season Year')"
                   oninput="this.setCustomValidity('')">
            <br>
            <label for="courseprefix">Course Prefix:</label>
            <input type="text"
                   name="courseprefix" 
                   required 
                   pattern="[A-Z]" 
                   minlength="3" 
                   maxlength="4" 
                   id="courseprefix"
                   oninvalid="this.setCustomValidity('Enter Data in this format: CSCI')"
                   oninput="this.setCustomValidity('')">
            <br>
            <label for="coursenumber">Course Number:</label>
            <input type="text"
                   name="coursenumber" 
                   required 
                   pattern="[0-9]{3}" 
                   step="1" 
                   min="100" 
                   max="499" 
                   id="coursenumber"
                   oninvalid="this.setCustomValidity('Enter Data in this format: 000')"
                   oninput="this.setCustomValidity('')">
            <br>
            <label for="coursesection">Course Section:</label>
            <input type="text" 
                   name="coursesection" 
                   required 
                   pattern="[0-9]{2}" 
                   id="coursesection"
                   oninvalid="this.setCustomValidity('Enter Data in this format: 01')"
                   oninput="this.setCustomValidity('')">
            <br>
            <input type="submit" name="submitbutton" id="submitbutton">
        </form>

        <footer>

        </footer>
    </body>
</html>
