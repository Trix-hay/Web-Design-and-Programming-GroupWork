<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Add Instructor" content="Allows users to add an instructor.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Add Instructor</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a>
            <h2>Add Instructor</h2>
            <p>This page allows users to add an instructor to our web application.</p>
        </header>

        <nav>

            <a href="homepage.html">Home</a>
            <a href="enrollstudent.html">Enroll Student</a>
            <a href="addinstructor.html">Add Instructor</a>
            <a href="addcourse.html">Add Course</a>
            <a href="registercourse.html">Register Course</a>
            <a href="dropcourse.html">Drop Course</a>
            <a href="userManual.html">User Manual</a>
            <a href="programmerManual.html">Programmer Manual</a>

        </nav>

        <main>

            <form>
                <label for="InstructorFirstName">Instructor's First Name:</label>
                <input type="text" id="InstructorFirstName" name="InstructorFirstName"><br>

                <label for="InstructorLastName">Instructor's Last Name:</label>
                <input type="text" id="InstructorLastName" name="InstructorLastName"><br>

                <label for="Department">Instructor's Department:</label>
                <input type="text" id="Department" name="Department"><br>

                <label for="Rank">Rank:</label>
                <select name="Rank">
                    <option>Instructor</option>
                    <option>Assistant Professor</option>
                    <option>Associate Professor</option>
                    <option>Professor</option>
                </select><br>

                <label for="InstructorEmailAddress">Instructor's Email:</label>
                <input type="text" id="InstructorEmailAddress" name="InstructorEmailAddress"><br>

                <button type="submit">Submit</button>
            </form>

        </main>
       <footer>
           
       </footer> 
    </body>
</html>
