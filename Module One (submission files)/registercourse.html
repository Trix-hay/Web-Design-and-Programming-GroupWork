<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="utf-8">
        <meta name="Register Course" content="Allows users to register for a course.">
        <link rel="stylesheet" href="moduleOne.css">
        <title>Course Registration: Register Course</title>
    </head>

    <body>
        <header>
            <a href="homepage.html"><h1>Course Registration System</h1></a> 
            <h2>Register Course</h2>
            <p>This page allows users to register for a course.</p>
        </header>

        <nav>

            <a href="homepage.html">Home</a>
            <a href="enrollstudent.html">Enroll Student</a>
            <a href="addinstructor.html">Add Instructor</a>
            <a href="addcourse.html">Add Course</a>
            <a href="registercourse.html">Register Course</a>
            <a href="dropcourse.html">Drop Course</a>
            <a href="userManual.html">User Manual</a>
            <a href="programmerManual.html">Programmer Manual</a>

        </nav>

        <main>
        
            <form method="POST" enctype="multipart/form-data">
                <label for="firstname">First Name:</label>
                <input type="text" name="firstname" id="firstname">
                <br>
                <label for="lastname">Last Name:</label>
                <input type="text" name="lastname" id="lastname">
                <br>
                <label for="semester">Semester and Year:</label>
                <input type="text" name="semester" id="semester">
                <br>
                <label for="courseprefix">Course Prefix:</label>
                <input type="text" name="courseprefix" id="courseprefix">
                <br>
                <label for="coursenumber">Course Number:</label>
                <input type="text" name="coursenumber" id="coursenumber">
                <br>
                <label for="coursesection">Course Section:</label>
                <input type="text" name="coursesection" id="coursesection">
                <br>
                <button type="submit">Submit</button>
            </form>

        </main>

        <footer>

        </footer>
    </body>
</html>
